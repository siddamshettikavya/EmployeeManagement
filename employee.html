
<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>
</head>
<body>
    <h2>Employee Registration</h2>

    <form>
        Employee ID:
        <input type="text" required><br><br>

        Employee Name:
        <input type="text" required><br><br>

        Email:
        <input type="email" required><br><br>

        Department:
        <input type="text"><br><br>

        Phone:
        <input type="tel"><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
